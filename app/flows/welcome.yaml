id: welcome
name: Welcome Flow
description: Simple welcome conversation with main menu
start_step: welcome_message

variables:
  company_name: "Mi Empresa"
  support_hours: "9:00 - 18:00"
  support_phone: "+1234567890"
  support_email: "contacto@miempresa.com"

error_handling:
  validation_failed: show_error
  timeout: show_timeout
  invalid_choice: show_invalid_choice

steps:
  - id: welcome_message
    type: message
    name: Welcome Message
    message: "¡Hola! 👋 Bienvenido a {{company_name}}. ¿En qué puedo ayudarte hoy?"
    message_type: text
    next_step: main_menu

  - id: main_menu
    type: choice
    name: Main Menu
    message: "Selecciona una opción:"
    choice_type: buttons
    options:
      - id: products
        title: "Ver Productos"
      - id: services
        title: "Servicios"
      - id: contact
        title: "Contacto"
      - id: help
        title: "Ayuda"
    next_step: process_choice

  - id: process_choice
    type: condition
    name: Process Choice
    conditions:
      - condition: "choice == 'products'"
        next_step: show_products
      - condition: "choice == 'services'"
        next_step: show_services
      - condition: "choice == 'contact'"
        next_step: show_contact
      - condition: "choice == 'help'"
        next_step: show_help

  - id: show_products
    type: message
    name: Show Products
    message: "🛍️ Aquí tienes nuestros productos disponibles:\n\n• Café Premium - $15.99\n• Café Orgánico - $18.99\n• Café Especial - $22.99\n\n¿Te interesa algún producto específico?"
    next_step: product_interest

  - id: product_interest
    type: choice
    name: Product Interest
    message: "¿Qué te gustaría hacer?"
    choice_type: buttons
    options:
      - id: order
        title: "Hacer Pedido"
      - id: info
        title: "Más Información"
      - id: back
        title: "Volver al Menú"
    next_step: process_product_choice

  - id: process_product_choice
    type: condition
    name: Process Product Choice
    conditions:
      - condition: "choice == 'order'"
        next_step: start_order_flow
      - condition: "choice == 'info'"
        next_step: product_info
      - condition: "choice == 'back'"
        next_step: main_menu

  - id: start_order_flow
    type: message
    name: Start Order Flow
    message: "¡Perfecto! Te ayudo con tu pedido. 🛍️"
    next_step: end

  - id: product_info
    type: message
    name: Product Info
    message: "📋 Información detallada de nuestros productos:\n\n• Café Premium: Tostado artesanalmente\n• Café Orgánico: Sin pesticidas\n• Café Especial: Origen único\n\n¿Te gustaría hacer un pedido?"
    next_step: end

  - id: show_services
    type: message
    name: Show Services
    message: "🔧 Estos son nuestros servicios:\n\n• Consultoría\n• Desarrollo\n• Diseño\n• Soporte\n\n¿Te interesa algún servicio?"
    next_step: end

  - id: show_contact
    type: message
    name: Show Contact
    message: "📞 Información de contacto:\n\n🏢 Empresa: {{company_name}}\n📱 Teléfono: {{support_phone}}\n📧 Email: {{support_email}}\n🕒 Horario: {{support_hours}}\n\n¿Necesitas más información?"
    next_step: end

  - id: show_help
    type: message
    name: Show Help
    message: "🆘 ¿Necesitas ayuda?\n\nPuedes:\n• Seleccionar opciones del menú\n• Escribir tu pregunta\n• Contactarnos directamente\n\n¿En qué más puedo ayudarte?"
    next_step: end

  - id: show_error
    type: message
    name: Show Error
    message: "❌ Lo siento, hubo un error. Por favor, intenta nuevamente."
    next_step: main_menu

  - id: show_timeout
    type: message
    name: Show Timeout
    message: "⏰ La conversación ha expirado. ¿Te gustaría empezar de nuevo?"
    next_step: welcome_message

  - id: show_invalid_choice
    type: message
    name: Show Invalid Choice
    message: "❌ Opción no válida. Por favor, selecciona una de las opciones disponibles."
    next_step: main_menu

  - id: end
    type: end
    name: End
    message: "¡Gracias por contactarnos! 😊"

metadata:
  version: "1.0"
  author: "Template Creator"
  last_updated: "2024-10-10"
  tags: ["welcome", "menu", "basic"]
