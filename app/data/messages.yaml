# Sistema de mensajes para WhatsApp Bot
# Este archivo contiene todos los mensajes que puede enviar el bot
# Los tags permiten cambiar fácilmente los mensajes sin modificar código

messages:
  # Mensajes de bienvenida
  welcome:
    new_user: |
      ¡Hola! 👋 
      
      Bienvenido/a a nuestro servicio de atención al cliente. 
      
      Soy tu asistente virtual y estoy aquí para ayudarte con cualquier consulta que tengas sobre nuestros productos y servicios.
      
      ¿En qué puedo ayudarte hoy? 😊
    
    returning_user: |
      ¡Hola de nuevo! 👋
      
      Me alegra verte otra vez. 
      
      ¿Hay algo en lo que pueda ayudarte hoy? Estoy aquí para resolver cualquier duda que tengas.
  
  # Mensajes de error
  error:
    general: |
      Lo siento, ha ocurrido un error técnico. 😔
      
      Por favor, intenta de nuevo en unos minutos o contacta con nuestro equipo de soporte.
    
    invalid_message: |
      No pude procesar tu mensaje. 🤔
      
      Por favor, intenta escribir tu consulta de manera más clara o utiliza palabras clave como:
      • "productos"
      • "servicios"
      • "precios" 
      • "horarios"
      • "contacto"
  
  # Mensajes informativos
  info:
    hours: |
      🕒 **Nuestros horarios de atención:**
      
      • Lunes a Viernes: 8:00 AM - 6:00 PM
      • Sábados: 9:00 AM - 2:00 PM
      • Domingos: Cerrado
      
      Fuera de estos horarios, responderemos tu mensaje tan pronto como sea posible.
    
    contact: |
      📞 **Información de contacto:**
      
      • Teléfono: {company_phone}
      • Email: {company_email}
      • Dirección: {company_address}
      
      También puedes visitar nuestro sitio web: {company_website}
  
  # Estados de conversación
  states:
    waiting_response: |
      Estoy esperando tu respuesta... ⏳
      
      Tómate tu tiempo para escribir lo que necesitas.
    
    processing: |
      Procesando tu solicitud... 🔄
      
      Un momento por favor.
  
  # Mensajes de despedida
  goodbye:
    default: |
      ¡Gracias por contactarnos! 😊
      
      Si tienes más preguntas, no dudes en escribirnos nuevamente.
      
      ¡Que tengas un excelente día! 🌟
    
    satisfaction: |
      Me alegra haber podido ayudarte. 😊
      
      ¿Hay algo más en lo que pueda asistirte?
  
  # Confirmaciones
  confirmation:
    received: |
      ✅ Mensaje recibido correctamente.
      
      Te responderemos pronto.
    
    processing_order: |
      ✅ Tu solicitud ha sido registrada.
      
      Te contactaremos en breve con los detalles.

# Configuración de mensajes
config:
  # Variables que se pueden usar en los mensajes
  variables:
    company_name: "{company_name}"
    company_email: "{company_email}"
    company_phone: "{company_phone}"
    company_address: "{company_address}"
    company_website: "{company_website}"
  
  # Configuración de respuestas automáticas
  auto_responses:
    enabled: true
    delay_seconds: 2
    max_retries: 3
  
  # Configuración de estados
  state_timeout:
    minutes: 30
    warning_message: |
      ⏰ Tu sesión expirará en 5 minutos por inactividad.
      
      Si necesitas continuar, simplemente escribe cualquier mensaje.
