[tool:pytest]
minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests
    integration: Integration tests
    flow: Flow tests
    slow: Slow tests
    demo: Demo tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning