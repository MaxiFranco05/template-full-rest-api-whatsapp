name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r tests/requirements-testing.txt
        
    - name: Run tests
      run: pytest tests/ -v
      
    - name: Build package
      run: |
        python -m build
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name || github.event.inputs.version }}
        release_name: Release ${{ github.ref_name || github.event.inputs.version }}
        body: |
          ## 🚀 Release ${{ github.ref_name || github.event.inputs.version }}
          
          ### 📋 What's New
          - Automated release process
          - Full test suite passed
          - Docker image built and tested
          
          ### 📦 Assets
          - Source code (zip)
          - Source code (tar.gz)
          - Docker image available on Docker Hub
          
          ### 🔧 Installation
          ```bash
          # Using pip
          pip install business-api-template
          
          # Using Docker
          docker pull ${{ secrets.DOCKER_USERNAME }}/business-api-template:${{ github.ref_name || github.event.inputs.version }}
          ```
          
          ### 📚 Documentation
          - [API Documentation](https://api.yourapp.com/docs)
          - [Installation Guide](https://github.com/yourusername/business-api-template#installation)
          - [Configuration](https://github.com/yourusername/business-api-template#configuration)
        draft: false
        prerelease: false
        
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/
        asset_name: business-api-template-${{ github.ref_name || github.event.inputs.version }}
        asset_content_type: application/zip
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/business-api-template:${{ github.ref_name || github.event.inputs.version }}
          ${{ secrets.DOCKER_USERNAME }}/business-api-template:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Notify release
      run: |
        echo "📢 Release ${{ github.ref_name || github.event.inputs.version }} created successfully!"
        echo "🐳 Docker image: ${{ secrets.DOCKER_USERNAME }}/business-api-template:${{ github.ref_name || github.event.inputs.version }}"
        echo "📦 Package: business-api-template-${{ github.ref_name || github.event.inputs.version }}"
